# main 병합 규칙: develop → main PR만 허용
name: main guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    name: source branch is develop
    runs-on: ubuntu-latest
    steps:
      - name: PR 출발 브랜치 확인
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main으로의 PR은 develop 브랜치에서만 허용 (현재: $HEAD_REF). frontend · backend는 develop으로 PR 생성"
            exit 1
          fi
          echo "출발 브랜치 develop 확인"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env · API 키 · 개인키 커밋 여부 검사
        run: sh scripts/check-secrets.sh
