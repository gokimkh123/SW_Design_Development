# frontend · backend CI 통과 시 develop 자동 병합 → develop CI 실행
# 보호 경로(CI/CD · 보안 · 배포 설정, 공통 문서) 변경 포함 시 자동 병합 중단 → PR로 건한 승인 후 반영
# 충돌 시 실패 처리: 해당 브랜치에서 git pull origin develop 후 충돌 해결 · push
name: auto merge to develop

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [frontend, backend]

# 브랜치별 직렬 실행: 같은 브랜치의 대기 중 실행만 최신 커밋으로 교체 (다른 브랜치 병합은 유지)
concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  merge:
    name: merge into develop
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: 보호 경로 변경 확인
        run: |
          files=$(gh api "repos/$REPO/compare/develop...$SHA" --jq '.files[].filename')
          PROTECTED='^(\.github/|\.githooks/|scripts/|deploy/|docs/common/|\.gitignore$|\.gitattributes$|\.dockerignore$|(.*/)?Dockerfile$)'
          blocked=$(printf '%s\n' "$files" | grep -E "$PROTECTED" || true)
          if [ -n "$blocked" ]; then
            echo "::error::보호 경로 변경 포함 → 자동 병합 중단. $BRANCH → develop PR 생성 후 건한 승인 필요"
            printf '%s\n' "$blocked" | sed 's/^/  /'
            exit 1
          fi
          echo "보호 경로 변경 없음"

      - name: develop 병합
        id: merge
        run: |
          set +e
          for attempt in 1 2 3; do
            out=$(gh api -i -X POST "repos/$REPO/merges" \
              -f base=develop -f head="$SHA" \
              -f commit_message="chore: $BRANCH → develop 자동 병합 (CI 통과 ${SHA:0:7})" 2>&1)
            status=$(printf '%s\n' "$out" | head -1 | awk '{print $2}')
            case "$status" in
              201) echo "$BRANCH(${SHA:0:7}) → develop 병합 완료"; echo "merged=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              204) echo "develop에 이미 반영된 커밋 (병합 생략)"; exit 0 ;;
            esac
            # 다른 브랜치의 동시 병합 등 일시 오류 대비 재시도
            sleep 10
          done
          if [ "$status" = "409" ]; then
            echo "::error::$BRANCH와 develop 충돌 → $BRANCH에서 'git pull origin develop' 후 충돌 해결 · push"
          else
            printf '%s\n' "$out" | tail -5
          fi
          exit 1

      # GITHUB_TOKEN으로 만든 push는 CI를 자동 실행하지 않으므로 직접 실행
      - name: develop CI 실행
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run ci.yml --ref develop -R "$REPO"
