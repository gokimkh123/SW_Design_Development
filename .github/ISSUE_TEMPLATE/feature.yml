name: 기능 · 작업
description: 구현할 기능이나 해야 할 작업을 등록합니다
title: "[영역] "
labels: ["type:feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - 프론트엔드 (동현)
        - 백엔드 (일준 · 범찬)
        - AI 엔진 (건한)
        - PM · 문서 (건한)
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 (11/3 시연 필수)
        - P1 (여유 있으면)
        - P2 (최종 개발)
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: 예) 설문 12문항에 답하면 10초 안에 페르소나 카드가 보인다
  - type: input
    id: refs
    attributes:
      label: 관련 문서 · 화면 ID
      placeholder: 예) PRD FR-A4 · API POST /api/personas · 화면 A4
